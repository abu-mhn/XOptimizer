<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
  <title>X Optimizer — What's New</title>
  <link rel="stylesheet" href="style.css?v=78e48aa7">
  <script>
    // Apply the saved theme class early so the page doesn't flash the
    // default dark theme before paint.
    (function applyEarlyTheme() {
      try {
        var t = localStorage.getItem("theme");
        if (t && /^[a-z]+$/.test(t) && t !== "dark") {
          document.addEventListener("DOMContentLoaded", function () {
            document.body.classList.add(t + "-mode");
          });
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <main class="updates-page">
    <header class="updates-header">
      <h1 class="updates-title">What's New</h1>
      <p class="updates-subtitle">Recent changes to X Optimizer.</p>
      <p class="updates-version">Version <span class="updates-version-num">v1.28.0</span></p>
    </header>

    <!-- Bump data-version when the list below changes so the splash flags
         it as fresh for returning users. Keep this attribute in sync with
         the visible version number above. -->
    <article class="updates-card" data-version="v1.28.0">
      <ul class="popup-list">
        <li><strong>Your tier on your profile.</strong> Your Battle Royale tier now sits beside your win rate, on the Profile tab and the sidebar card. Nothing shows until you've played enough scored matches to earn one.</li>
      </ul>
    </article>

    <nav class="updates-nav">
      <a class="btn updates-enter" href="dashboard/">Open the app</a>
    </nav>
  </main>
  <script>
    // Where "Open the app" lands depends on the width, because the Dashboard
    // tab only exists on narrow screens. On desktop the side panel already
    // shows the dashboard on every other tab, so the tab is hidden there and
    // the app opens on the Calculator instead. 1200px is the same breakpoint
    // the side panel and the hidden tab use — keep the three in step.
    //
    // The href starts as dashboard/, so a browser with JS disabled still gets
    // a working link.
    (function pickEntryTab() {
      var link = document.querySelector(".updates-enter");
      if (!link || !window.matchMedia) return;
      var wide = window.matchMedia("(min-width: 1200px)");
      var apply = function () {
        link.setAttribute("href", wide.matches ? "calculator/" : "dashboard/");
      };
      apply();
      // Resizing the window before clicking should still land in the right
      // place. addListener is the old spelling, kept for older WebKit.
      if (wide.addEventListener) wide.addEventListener("change", apply);
      else if (wide.addListener) wide.addListener(apply);
    })();
  </script>
</body>
</html>
